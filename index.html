<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5bff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Spend Tracker</title>
<style>
:root{--bg:#f1f4f8;--surface:#fff;--ink:#0f1b2d;--muted:#5d6b80;--line:#dbe2ec;--accent:#2f5bff;--on:#fff;--bar:#e6ecf5;--danger:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#0e1522;--surface:#162033;--ink:#e8edf5;--muted:#93a1b8;--line:#26344d;--accent:#6f8dff;--on:#0e1522;--bar:#22304a;--danger:#ff7b6b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 8px}h2{font-size:1rem;margin:0 0 12px}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);flex:1 1 140px}
input,select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
:is(input,select,button):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer}
button.primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;flex:1;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on);font-weight:700}
.nav{display:flex;align-items:center;gap:8px;margin:12px 0}.nav strong{flex:1;text-align:center}
.total{font-size:2.25rem;font-weight:700;line-height:1.1}
.sub{color:var(--muted);font-size:.9rem}
.cat{margin:10px 0}.cat .top{display:flex;justify-content:space-between;font-size:.92rem}
.track{height:10px;background:var(--bar);border-radius:6px;overflow:hidden;margin-top:4px}
.fill{height:100%;background:var(--accent);border-radius:6px}
.over .fill{background:var(--danger)}
.days{display:flex;align-items:flex-end;gap:3px;height:80px;margin-top:8px}
.days div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.daylbl{display:flex;gap:3px;font-size:.7rem;color:var(--muted)}.daylbl span{flex:1;text-align:center;overflow:hidden}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}li:first-child{border-top:0}
li .meta{flex:1;min-width:0}li small{display:block;color:var(--muted)}li .amt{font-weight:700;white-space:nowrap}
li button{min-height:36px;padding:4px 10px;color:var(--danger)}
.empty{color:var(--muted);text-align:center;padding:12px 0}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar .sub{flex:1 1 200px}
.bgrid{display:flex;gap:16px;margin:14px 0 10px}.bgrid>div{flex:1}
.big{font-size:1.6rem;font-weight:700;line-height:1.2}
.over .big.l{color:var(--danger)}
.meta b{font-weight:600}.rem{font-style:italic;white-space:pre-wrap;overflow-wrap:anywhere}
.bad{border-color:var(--danger)!important}
#report{display:none}
@media print{body{background:#fff!important;color:#111!important;padding:0}body>main{display:none!important}#report{display:block;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#111}@page{margin:14mm}#report *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Spend Tracker</h1>
<div class="bar">
  <span class="sub" id="sync">Saved on this device</span>
  <button id="signin" type="button" class="primary" hidden>Sign in with Microsoft</button>
  <button id="gsignin" type="button" class="primary" hidden>Sign in with Google</button>
  <button id="syncnow" type="button" hidden>Sync now</button>
  <button id="signout" type="button" hidden>Sign out</button>
</div>

<section style="margin-top:16px" aria-label="Add expense">
<h2>Add an expense</h2>
<div class="row">
<label>Amount (₹)<input id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="150"></label>
<label>Category<select id="cat"></select></label>
<label id="namewrap" hidden>Name this expense (required)<input id="cname" type="text" maxlength="40" placeholder="e.g. Phone repair"></label>
<label>Date<input id="date" type="date"></label>
<label>Remarks (optional)<input id="note" type="text" maxlength="120" placeholder="e.g. with friends, bus pass renewal"></label>
<button class="primary" id="add" type="button" style="flex:1 1 100%">Add expense</button>
</div>
</section>

<section aria-label="Monthly budget">
<h2>Monthly budget <span class="sub" id="bmonth"></span></h2>
<div class="row" style="align-items:flex-end">
<label>My budget for each month (₹)<input id="budget" type="number" inputmode="decimal" min="0" placeholder="e.g. 8000"></label>
<button id="bsave" type="button" class="primary" style="flex:0 0 auto">Save</button>
</div>
<div id="bud"></div>
</section>

<section aria-label="Summary">
<div class="seg" role="group" aria-label="View">
<button id="vw" type="button" aria-pressed="true">Week</button>
<button id="vm" type="button" aria-pressed="false">Month</button>
</div>
<div class="nav"><button id="prev" type="button" aria-label="Previous">‹</button><strong id="range"></strong><button id="next" type="button" aria-label="Next">›</button></div>
<div class="total" id="total">₹0</div>
<div class="sub" id="avg"></div>
<div class="days" id="days" aria-hidden="true"></div>
<div class="daylbl" id="dl" aria-hidden="true"></div>
</section>

<section aria-label="By category"><h2>By category</h2><div id="cats"></div></section>
<section aria-label="Expenses"><h2>Expenses in this period</h2><ul id="list"></ul></section>

<section aria-label="Export">
<h2>Export</h2>
<div class="row">
<button id="pdf" type="button" class="primary">PDF report (with charts)</button>
<button id="xlsx" type="button">Excel file</button>
<button id="csv" type="button">CSV</button>
</div>
<p class="sub" id="exinfo" style="margin:10px 0 0">The PDF covers the week or month shown above. Excel and CSV include all your expenses.</p>
</section>
</main>
<div id="report"></div>

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* Your IDs live in config.js, so updating this file never wipes them. */
const CLIENT_ID=(window.APP&&APP.microsoftClientId)||"PASTE-YOUR-CLIENT-ID-HERE";
const G_CLIENT_ID=(window.APP&&APP.googleClientId)||"PASTE-YOUR-GOOGLE-CLIENT-ID-HERE";
const CATS=["Food","Transport","Supplements","Gym & gear","Study","Hostel","Health","Fun","Other"];
const REDIRECT=location.origin+location.pathname.replace(/index\.html$/,"");
const AUTH="https://login.microsoftonline.com/consumers/oauth2/v2.0/";
const SCOPE="Files.ReadWrite.AppFolder offline_access";
const FILE="https://graph.microsoft.com/v1.0/me/drive/special/approot:/expenses.json:/content";
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const jget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

let D=jget("st:data",{items:[],budget:0,budgetAt:0});
let T=jget("st:tok",null),G=jget("st:gtok",null),P=localStorage.getItem("st:prov")||(T?"ms":""),view="week",anchor=new Date(),busy=false,timer=null;
const live=()=>D.items.filter(x=>!x.del);
let CAN={};
function canon(){CAN={};const base={};CATS.forEach(c=>base[c.toLowerCase()]=c);
  live().slice().sort((a,b)=>a.at-b.at).forEach(x=>{if(x.cat==="Other"&&x.name){const k=x.name.trim().toLowerCase();if(!CAN[k])CAN[k]=base[k]||x.name.trim()}})}
const ecat=x=>x.cat==="Other"&&x.name?(CAN[x.name.trim().toLowerCase()]||x.name.trim()):x.cat;
function catList(){canon();const cu=[...new Set(live().map(ecat))].filter(c=>!CATS.includes(c)).sort((a,b)=>a.localeCompare(b));return[...CATS.filter(c=>c!=="Other"),...cu,"Other"]}
function fillCats(){
  const cur=$("cat").value,cu=catList().filter(c=>!CATS.includes(c));
  $("cat").innerHTML=CATS.filter(c=>c!=="Other").map(c=>`<option>${esc(c)}</option>`).join("")+cu.map(c=>`<option value="custom:${esc(c)}">${esc(c)}</option>`).join("")+'<option value="Other">Other (type a new name)</option>';
  if([...$("cat").options].some(o=>o.value===cur))$("cat").value=cur;
}
const saveLocal=()=>jset("st:data",D);
const setSync=t=>$("sync").textContent=t;

/* ---------- Microsoft sign-in (OAuth code flow with PKCE) ---------- */
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function login(){
  const v=b64u(crypto.getRandomValues(new Uint8Array(32)));
  const ch=b64u(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
  const st=b64u(crypto.getRandomValues(new Uint8Array(12)));
  jset("st:pkce",{v,st});
  location.href=AUTH+"authorize?"+new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT,response_mode:"query",scope:SCOPE,code_challenge:ch,code_challenge_method:"S256",state:st,prompt:"select_account"});
}
async function tokenReq(p){
  const r=await fetch(AUTH+"token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:CLIENT_ID,scope:SCOPE,redirect_uri:REDIRECT,...p})});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error_description||j.error||"Sign-in failed");
  T={access:j.access_token,refresh:j.refresh_token||(T&&T.refresh),exp:Date.now()+j.expires_in*1000-60000};
  jset("st:tok",T);
}
async function msToken(){
  if(!T)return null;
  if(Date.now()<T.exp)return T.access;
  try{await tokenReq({grant_type:"refresh_token",refresh_token:T.refresh});return T.access}
  catch(e){T=null;P="";localStorage.removeItem("st:tok");localStorage.removeItem("st:prov");ui();setSync("Signed out. Sign in again to keep syncing.");return null}
}
async function handleReturn(){
  const q=new URLSearchParams(location.search);
  if(!q.has("code")&&!q.has("error"))return;
  history.replaceState(null,"",REDIRECT);
  const p=jget("st:pkce",{});localStorage.removeItem("st:pkce");
  if(q.has("error")){setSync("Sign-in cancelled: "+(q.get("error_description")||q.get("error")));return}
  if(q.get("state")!==p.st){setSync("Sign-in check failed. Try again.");return}
  try{await tokenReq({grant_type:"authorization_code",code:q.get("code"),code_verifier:p.v});P="ms";localStorage.setItem("st:prov","ms")}
  catch(e){setSync("Sign-in failed: "+e.message)}
}

/* ---------- OneDrive sync (one JSON file in the app's own folder) ---------- */
async function msPull(a){
  const r=await fetch(FILE,{headers:{Authorization:"Bearer "+a}});
  if(r.status===404)return null;
  if(!r.ok)throw new Error("OneDrive replied "+r.status);
  return r.json();
}
async function msPush(a){
  const r=await fetch(FILE,{method:"PUT",headers:{Authorization:"Bearer "+a,"Content-Type":"application/json"},body:JSON.stringify(D)});
  if(!r.ok)throw new Error("OneDrive replied "+r.status);
}
/* ---------- Google Drive (hidden app-data folder) ---------- */
let gc=null,gres=null,grej=null;
function gAuth(interactive){return new Promise((res,rej)=>{
  if(!window.google||!google.accounts){rej(new Error("Google sign-in didn’t load. Check your connection."));return}
  gres=res;grej=rej;
  gc=gc||google.accounts.oauth2.initTokenClient({client_id:G_CLIENT_ID,scope:"https://www.googleapis.com/auth/drive.appdata",
    callback:r=>{if(r.error){grej(new Error(r.error_description||r.error));return}
      G={access:r.access_token,exp:Date.now()+r.expires_in*1000-60000};jset("st:gtok",G);gres(G.access)},
    error_callback:e=>grej(new Error(e.type||"Google sign-in was cancelled"))});
  gc.requestAccessToken({prompt:interactive?"select_account":""});
})}
async function gToken(){
  if(G&&Date.now()<G.exp)return G.access;
  ui();setSync("Google session ended. Tap Reconnect Google to keep syncing.");return null;
}
async function gFileId(a){
  let id=localStorage.getItem("st:gfid");if(id)return id;
  const r=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q="+encodeURIComponent("name='expenses.json'"),{headers:{Authorization:"Bearer "+a}});
  if(!r.ok)throw new Error("Google Drive replied "+r.status);
  const j=await r.json();id=j.files&&j.files[0]&&j.files[0].id;
  if(id)localStorage.setItem("st:gfid",id);return id||null;
}
async function gPull(a){
  const id=await gFileId(a);if(!id)return null;
  const r=await fetch("https://www.googleapis.com/drive/v3/files/"+id+"?alt=media",{headers:{Authorization:"Bearer "+a}});
  if(r.status===404){localStorage.removeItem("st:gfid");return null}
  if(!r.ok)throw new Error("Google Drive replied "+r.status);return r.json();
}
async function gPush(a){
  const id=await gFileId(a),body=JSON.stringify(D);let r;
  if(id){
    r=await fetch("https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media",{method:"PATCH",headers:{Authorization:"Bearer "+a,"Content-Type":"application/json"},body});
    if(r.status===404)localStorage.removeItem("st:gfid");
  }else{
    const bd="sp"+Date.now(),m=`--${bd}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({name:"expenses.json",parents:["appDataFolder"]})}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
    r=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{Authorization:"Bearer "+a,"Content-Type":"multipart/related; boundary="+bd},body:m});
    if(r.ok){localStorage.setItem("st:gfid",(await r.json()).id);return}
  }
  if(!r.ok)throw new Error("Google Drive replied "+r.status);
}
const token=()=>P==="g"?gToken():msToken();
const pull=a=>P==="g"?gPull(a):msPull(a);
const push=a=>P==="g"?gPush(a):msPush(a);
function merge(R){
  const m=new Map(D.items.map(x=>[x.id,x]));
  (R.items||[]).forEach(x=>{const y=m.get(x.id);if(!y||x.at>y.at)m.set(x.id,x)});
  D.items=[...m.values()];
  if((R.budgetAt||0)>(D.budgetAt||0)){D.budget=R.budget||0;D.budgetAt=R.budgetAt}
}
async function sync(){
  if(busy||!P)return;
  busy=true;setSync("Syncing…");
  try{
    const a=await token();if(!a)return;
    const R=await pull(a);if(R)merge(R);
    saveLocal();$("budget").value=D.budget||"";render();
    await push(a);
    setSync("Synced to "+(P==="g"?"Google Drive":"OneDrive")+" at "+new Date().toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}));
  }catch(e){setSync("Sync failed, saved on this device. "+e.message)}
  finally{busy=false}
}
const queue=()=>{if(!P)return;clearTimeout(timer);timer=setTimeout(sync,1500)};
function ui(){
  const ok=CLIENT_ID.indexOf("PASTE")!==0,gok=G_CLIENT_ID.indexOf("PASTE")!==0;
  const gExp=P==="g"&&(!G||Date.now()>=G.exp);
  $("signin").hidden=!ok||!!P;
  $("gsignin").hidden=!gok||(!!P&&!gExp);$("gsignin").textContent=gExp?"Reconnect Google":"Sign in with Google";
  $("syncnow").hidden=!P;$("signout").hidden=!P;
  if(!ok&&!gok)setSync(window.APP?"Saved on this device. No client IDs found in config.js yet.":"Saved on this device. config.js wasn’t found next to index.html.");
}

/* ---------- Tracker ---------- */
function period(){
  const a=new Date(anchor.getFullYear(),anchor.getMonth(),anchor.getDate());
  if(view==="week"){const s=new Date(a);s.setDate(a.getDate()-(a.getDay()+6)%7);const e=new Date(s);e.setDate(s.getDate()+6);return[s,e]}
  return[new Date(a.getFullYear(),a.getMonth(),1),new Date(a.getFullYear(),a.getMonth()+1,0)];
}
function render(){
  fillCats();
  const[s,e]=period(),a=ds(s),b=ds(e);
  const fmt=d=>d.toLocaleDateString("en-IN",{day:"numeric",month:"short"});
  $("range").textContent=view==="week"?fmt(s)+" – "+fmt(e)+" "+e.getFullYear():s.toLocaleDateString("en-IN",{month:"long",year:"numeric"});
  const items=live().filter(x=>x.date>=a&&x.date<=b).sort((x,y)=>y.date.localeCompare(x.date)||y.at-x.at);
  const total=items.reduce((t,x)=>t+x.amount,0),nd=Math.round((e-s)/864e5)+1;
  $("total").textContent=inr(total);
  $("avg").textContent=items.length?inr(total/nd)+" per day · "+items.length+" expense"+(items.length>1?"s":""):"No expenses yet in this period";
  const per=Array(nd).fill(0);items.forEach(x=>{per[Math.round((pd(x.date)-s)/864e5)]+=x.amount});
  const mx=Math.max(...per,1);
  $("days").innerHTML=per.map(v=>`<div style="height:${Math.max(v/mx*100,2)}%"></div>`).join("");
  $("dl").innerHTML=per.map((_,i)=>{const d=new Date(s);d.setDate(s.getDate()+i);return`<span>${view==="week"?d.toLocaleDateString("en-IN",{weekday:"narrow"}):(i%5===0?d.getDate():"")}</span>`}).join("");
  renderBudget();
  const by={};items.forEach(x=>by[ecat(x)]=(by[ecat(x)]||0)+x.amount);
  const rows=Object.entries(by).sort((x,y)=>y[1]-x[1]);
  $("cats").innerHTML=rows.length?rows.map(([c,v])=>`<div class="cat"><div class="top"><span>${esc(c)}</span><span>${inr(v)} · ${Math.round(v/total*100)}%</span></div><div class="track"><div class="fill" style="width:${v/total*100}%"></div></div></div>`).join(""):'<div class="empty">Add an expense to see the split.</div>';
  $("list").innerHTML=items.length?items.map(x=>`<li><div class="meta"><b>${esc(ecat(x))}</b><small>${fmt(pd(x.date))}</small>${x.note?`<small class="rem">${esc(x.note)}</small>`:""}</div><span class="amt">${inr(x.amount)}</span><button type="button" data-id="${x.id}" aria-label="Delete expense">Delete</button></li>`).join(""):'<li class="empty" style="display:block">Nothing recorded for this period.</li>';
  $("vw").setAttribute("aria-pressed",view==="week");$("vm").setAttribute("aria-pressed",view==="month");
}
function renderBudget(){
  const n=new Date(),ms=ds(new Date(n.getFullYear(),n.getMonth(),1)),me=ds(new Date(n.getFullYear(),n.getMonth()+1,0));
  const spent=live().filter(x=>x.date>=ms&&x.date<=me).reduce((t,x)=>t+x.amount,0);
  $("bmonth").textContent="· "+n.toLocaleDateString("en-IN",{month:"long",year:"numeric"});
  if(!(D.budget>0)){$("bud").className="";$("bud").innerHTML='<p class="sub" style="margin:12px 0 0">Enter your monthly budget above to see how much you have spent and how much is left.</p>';return}
  const left=D.budget-spent,over=left<0,sp=Math.round(spent/D.budget*100),lp=over?sp-100:100-sp;
  $("bud").className=over?"over":"";
  $("bud").innerHTML=`<div class="bgrid"><div><div class="sub">Spent</div><div class="big">${inr(spent)}</div><div class="sub">${sp}% of ${inr(D.budget)}</div></div><div><div class="sub">${over?"Over budget by":"Left"}</div><div class="big l">${inr(Math.abs(left))}</div><div class="sub">${lp}% ${over?"over":"remaining"}</div></div></div><div class="track" role="progressbar" aria-label="Budget used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(sp,100)}"><div class="fill" style="width:${Math.min(sp,100)}%"></div></div>`;
}
function shift(n){
  if(view==="week")anchor.setDate(anchor.getDate()+7*n);else anchor=new Date(anchor.getFullYear(),anchor.getMonth()+n,1);
  render();
}
$("date").value=ds(new Date());
$("cat").onchange=()=>{const o=$("cat").value==="Other";$("namewrap").hidden=!o;if(o)$("cname").focus()};
$("add").onclick=()=>{
  const cv=$("cat").value,amount=parseFloat($("amt").value);let cat=cv,name=$("cname").value.trim();
  if(cv.startsWith("custom:")){cat="Other";name=cv.slice(7)}
  if(!(amount>0)){$("amt").focus();return}
  $("cname").classList.toggle("bad",cv==="Other"&&!name);
  if(cv==="Other"&&!name){$("cname").focus();return}
  const date=$("date").value||ds(new Date());
  const id=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2));
  const it={id,amount,cat,date,note:$("note").value.trim(),at:Date.now()};
  if(cat==="Other")it.name=name;
  D.items.push(it);
  saveLocal();$("amt").value="";$("note").value="";$("cname").value="";anchor=pd(date);render();$("amt").focus();queue();
};
$("list").onclick=e=>{
  const b=e.target.closest("button[data-id]");if(!b)return;
  const x=D.items.find(i=>i.id===b.dataset.id);if(x){x.del=true;x.at=Date.now()}
  saveLocal();render();queue();
};

/* ---------- Exports ---------- */
const PAL=["#2f5bff","#e0457b","#f2a900","#1fa971","#8a5cf6","#00a3c4","#e8590c","#6b7a90","#b5179e"];
function pdfReport(){
  const[s,e]=period(),a=ds(s),b=ds(e),nd=Math.round((e-s)/864e5)+1;
  const items=live().filter(x=>x.date>=a&&x.date<=b).sort((x,y)=>x.date.localeCompare(y.date));
  const total=items.reduce((t,x)=>t+x.amount,0);
  const by={};items.forEach(x=>by[ecat(x)]=(by[ecat(x)]||0)+x.amount);
  const rows=Object.entries(by).sort((x,y)=>y[1]-x[1]);
  const L=catList(),col=c=>PAL[Math.max(L.indexOf(c),0)%PAL.length];
  const f=d=>d.toLocaleDateString("en-IN",{day:"numeric",month:"short"});
  const title=view==="week"?"Weekly report: "+f(s)+" – "+f(e)+" "+e.getFullYear():"Monthly report: "+s.toLocaleDateString("en-IN",{month:"long",year:"numeric"});
  const C=2*Math.PI*40;let off=0;
  const arcs=rows.map(([c,v])=>{const l=v/total*C,r=`<circle cx="60" cy="60" r="40" fill="none" stroke="${col(c)}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l;return r}).join("");
  const per=Array(nd).fill(0);items.forEach(x=>{per[Math.round((pd(x.date)-s)/864e5)]+=x.amount});
  const mx=Math.max(...per,1),bw=600/nd;
  const bars=per.map((v,i)=>{const h=v/mx*100,d=new Date(s);d.setDate(s.getDate()+i);
    const lb=nd<=7?d.toLocaleDateString("en-IN",{weekday:"short"}):(i%5===0?d.getDate():"");
    return `<rect x="${i*bw+bw*.15}" y="${115-h}" width="${bw*.7}" height="${Math.max(h,1)}" fill="#2f5bff" rx="2"/>`+(nd<=7&&v>0?`<text x="${i*bw+bw/2}" y="${111-h}" font-size="11" text-anchor="middle" fill="#111">${inr(v)}</text>`:"")+`<text x="${i*bw+bw/2}" y="132" font-size="11" text-anchor="middle" fill="#555">${lb}</text>`}).join("");
  let bud="";
  if(view==="month"&&D.budget>0){const left=D.budget-total,sp=Math.round(total/D.budget*100);
    bud=`<p style="margin:6px 0 0">Budget ${inr(D.budget)} · Spent ${inr(total)} (${sp}%) · ${left<0?"Over by "+inr(-left)+" ("+(sp-100)+"%)":"Left "+inr(left)+" ("+(100-sp)+"%)"}</p><div style="height:12px;background:#e6ecf5;border-radius:6px;margin-top:6px;overflow:hidden"><div style="height:100%;width:${Math.min(sp,100)}%;background:${left<0?"#c0392b":"#2f5bff"}"></div></div>`}
  const td="padding:6px 8px;border-bottom:1px solid #dbe2ec;vertical-align:top";
  $("report").innerHTML=`<h1 style="font-size:22px;margin:0">${esc(title)}</h1>
  <p style="color:#555;margin:4px 0 14px">Spend Tracker · created ${new Date().toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"})}</p>
  <div style="font-size:30px;font-weight:700">${inr(total)}</div>
  <div style="color:#555">${items.length} expense${items.length===1?"":"s"} · ${inr(total/nd)} per day</div>${bud}
  ${items.length?`<h2 style="font-size:15px;margin:20px 0 6px">Spending per day</h2><svg viewBox="0 0 600 140" width="100%">${bars}</svg>
  <h2 style="font-size:15px;margin:20px 0 6px">Where the money went</h2>
  <div style="display:flex;gap:24px;align-items:center"><svg viewBox="0 0 120 120" width="170" height="170">${arcs}</svg><div style="flex:1">${rows.map(([c,v])=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:3px 0"><span><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${col(c)};margin-right:8px"></span>${esc(c)}</span><span>${inr(v)} · ${Math.round(v/total*100)}%</span></div>`).join("")}</div></div>
  <h2 style="font-size:15px;margin:20px 0 6px">All expenses</h2>
  <table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="text-align:left;background:#e6ecf5"><th style="${td}">Date</th><th style="${td}">Expense</th><th style="${td}">Remarks</th><th style="${td};text-align:right">Amount</th></tr>
  ${items.map(x=>`<tr><td style="${td}">${f(pd(x.date))}</td><td style="${td}">${esc(ecat(x))}</td><td style="${td};color:#555;font-style:italic">${esc(x.note||"")}</td><td style="${td};text-align:right">${inr(x.amount)}</td></tr>`).join("")}</table>`:'<p style="margin-top:20px;color:#555">No expenses in this period.</p>'}`;
  setSync("Choose “Save as PDF” in the print screen.");
  setTimeout(()=>window.print(),100);
}
async function xlsx(){
  try{
    if(!window.XLSX)await new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="xlsx.full.min.js";sc.onload=res;sc.onerror=()=>rej(new Error("The Excel add-on didn’t load. Connect to the internet and try again."));document.head.appendChild(sc)});
    const L=catList(),items=live().sort((x,y)=>x.date.localeCompare(y.date)),wb=XLSX.utils.book_new();
    const add=(rows,name,w)=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=w.map(n=>({wch:n}));XLSX.utils.book_append_sheet(wb,ws,name)};
    add([["Date","Amount (₹)","Category","Remarks"],...items.map(x=>[x.date,x.amount,ecat(x),x.note||""])],"Expenses",[12,12,22,40]);
    const wkey=d=>{const t=pd(d);t.setDate(t.getDate()-(t.getDay()+6)%7);return ds(t)};
    const pivot=(label,kf,bud)=>{
      const keys=[...new Set(items.map(x=>kf(x.date)))].sort(),hd=[label,...L,"Total"];if(bud)hd.push("Budget","Left");
      return[hd,...keys.map(k=>{const m=items.filter(x=>kf(x.date)===k),r=[k,...L.map(c=>m.filter(x=>ecat(x)===c).reduce((t,x)=>t+x.amount,0))],t=m.reduce((q,x)=>q+x.amount,0);r.push(t);if(bud)r.push(D.budget,D.budget-t);return r})]};
    add(pivot("Month",d=>d.slice(0,7),D.budget>0),"Monthly",[12,...L.map(()=>13),12,12,12]);
    add(pivot("Week starting (Mon)",wkey,false),"Weekly",[20,...L.map(()=>13),12]);
    XLSX.writeFile(wb,"spend-tracker.xlsx");
    setSync("Excel file downloaded.");
  }catch(err){setSync(err.message)}
}
$("pdf").onclick=pdfReport;$("xlsx").onclick=xlsx;
